// Integration checks are a separate development mod and never enter release JARs.
sourceSets {
    gameTest {
        java.srcDir rootProject.file('common/src/gameTest/java')
        resources.srcDir rootProject.file('common/src/gameTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        rsadvanced {
            sourceSet sourceSets.main
        }
        if (project.name == 'fabric') {
            rsadvanced_test {
                sourceSet sourceSets.gameTest
            }
        }
    }
    runs {
        gameTest {
            if (project.name == 'fabric') {
                inherit server
                property 'fabric-api.gametest'
                property 'fabric-api.gametest.report-file', project.layout.buildDirectory.file('reports/gameTest/results.xml').get().asFile.absolutePath
            } else {
                mods {
                    rsadvanced {
                        sourceSet sourceSets.main
                    }
                    rsadvanced_test {
                        sourceSet sourceSets.gameTest
                    }
                }
                environment 'gametestserver'
                forgeTemplate 'gameTestServer'
                property 'rsadvanced.test.reportFile', project.layout.buildDirectory.file('reports/gameTest/results.xml').get().asFile.absolutePath
            }
            source sourceSets.gameTest
            runDir 'build/run/gameTest'
        }
        serverValidation {
            inherit gameTest
            if (project.name == 'fabric') {
                property 'fabric-api.gametest.report-file', project.layout.buildDirectory
                        .file('reports/serverValidation/results.xml').get().asFile.absolutePath
            } else {
                property 'rsadvanced.test.reportFile', project.layout.buildDirectory
                        .file('reports/serverValidation/results.xml').get().asFile.absolutePath
            }
            if (project.name == 'neoforge') {
                environment 'gametestserver'
                forgeTemplate 'gameTestServer'
                mods {
                    rsadvanced {
                        sourceSet sourceSets.main
                    }
                    rsadvanced_test {
                        sourceSet sourceSets.gameTest
                    }
                }
            }
            runDir 'build/run/serverValidation'
            property 'rsadvanced.test.clientServer', 'true'
            property 'rsadvanced.test.port', project.name == 'fabric' ? '25575' : '25576'
        }
        clientValidation {
            inherit client
            if (project.name == 'neoforge') {
                forgeTemplate 'client'
            }
            source sourceSets.gameTest
            runDir 'build/run/clientValidation'
            property 'rsadvanced.test.clientValidation', 'true'
            property 'rsadvanced.test.clientReport', project.layout.buildDirectory.file('reports/clientValidation/results.txt').get().asFile.absolutePath
            programArgs '--quickPlayMultiplayer', project.name == 'fabric' ? '127.0.0.1:25575' : '127.0.0.1:25576'
            if (project.name == 'neoforge') {
                mods {
                    rsadvanced {
                        sourceSet sourceSets.main
                    }
                    rsadvanced_test {
                        sourceSet sourceSets.gameTest
                    }
                }
            }
        }
        ['seed', 'check', 'empty', 'norandom'].each { phase ->
            create("anchorRestart${phase.capitalize()}") {
                inherit server
                source sourceSets.gameTest
                runDir phase == 'norandom' ? 'build/run/anchorNoRandom' : 'build/run/anchorRestart'
                property 'rsadvanced.test.anchorRestart', phase
                property 'rsadvanced.test.anchorReport', project.layout.buildDirectory
                        .file("reports/anchorRestart/${phase}.txt").get().asFile.absolutePath
                if (project.name == 'neoforge') {
                    environment 'server'
                    forgeTemplate 'server'
                    mods {
                        rsadvanced { sourceSet sourceSets.main }
                        rsadvanced_test { sourceSet sourceSets.gameTest }
                    }
                }
            }
        }
    }
}

['seed', 'check', 'empty', 'norandom'].eachWithIndex { phase, index ->
    tasks.named("runAnchorRestart${phase.capitalize()}") {
        dependsOn tasks.named('gameTestClasses')
        if (index > 0 && index < 3) {
            mustRunAfter "runAnchorRestart${['seed', 'check', 'empty'][index - 1].capitalize()}"
        }
        doFirst {
            File runDirectory = project.layout.buildDirectory.dir(phase == 'norandom' ? 'run/anchorNoRandom' : 'run/anchorRestart').get().asFile
            runDirectory.mkdirs()
            new File(runDirectory, 'eula.txt').text = 'eula=true\n'
            new File(runDirectory, 'server.properties').text =
                    'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nview-distance=2\nsimulation-distance=2\nlevel-type=minecraft:flat\ngenerate-structures=false\n'
            File configurationDirectory = new File(runDirectory, 'config')
            configurationDirectory.mkdirs()
            String rsConfigurationFile = project.name == 'neoforge'
                    ? 'refinedstorage-common.toml' : 'refinedstorage.toml'
            new File(configurationDirectory, rsConfigurationFile).text = '[controller]\nenergyCapacity = 100000\n'
            new File(configurationDirectory, 'rsadvanced.json').text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson([baseCost: 80, chunkCostMultiplier: 1, maxChunks: 256, randomTicks: phase != 'norandom']))
            project.layout.buildDirectory.file("reports/anchorRestart/${phase}.txt").get().asFile.delete()
        }
        doLast {
            File report = project.layout.buildDirectory.file("reports/anchorRestart/${phase}.txt").get().asFile
            if (!report.exists() || !report.text.startsWith('PASSED:')) {
                throw new GradleException(report.exists() ? report.text : 'Restart scenario did not produce a report')
            }
        }
    }
}

tasks.named('runGameTest') {
    dependsOn tasks.named('gameTestClasses')
    if (project.name == 'neoforge') {
        // Both launches copy the same Architectury agent. Windows locks the JAR
        // while a server is running, so loader tests must launch sequentially.
        mustRunAfter ':fabric:runGameTest'
    }
    doFirst {
        project.layout.buildDirectory.dir('reports/gameTest').get().asFile.mkdirs()
    }
}

tasks.named('check') {
    dependsOn tasks.named('runGameTest')
}

// The example is an actual external world datapack, in addition to the test mod's bundled definitions.
['runGameTest', 'runServerValidation'].each { taskName ->
    tasks.named(taskName) {
        dependsOn tasks.named('gameTestClasses')
        doFirst {
            String directory = taskName == 'runGameTest' ? 'gameTest' : 'serverValidation'
            project.layout.buildDirectory.dir("reports/${directory}").get().asFile.mkdirs()
            copy {
                from rootProject.file('common/src/gameTest/externalDatapack')
                into project.layout.buildDirectory.dir("run/${directory}/world/datapacks/rsadvanced-priority-check")
            }
            copy {
                from rootProject.file('examples/lava-datapack')
                into project.layout.buildDirectory.dir("run/${directory}/world/datapacks/rsadvanced-example")
            }
        }
    }
}

tasks.named('runClientValidation') {
    dependsOn tasks.named('gameTestClasses')
    doFirst {
        project.layout.buildDirectory.dir('reports/clientValidation').get().asFile.mkdirs()
        delete project.layout.buildDirectory.file('reports/clientValidation/results.txt')
        copy {
            from rootProject.file('common/src/gameTest/clientResources')
            into project.layout.buildDirectory.dir('run/clientValidation/resourcepacks')
        }
    }
    doLast {
        File report = project.layout.buildDirectory.file('reports/clientValidation/results.txt').get().asFile
        if (!report.exists() || report.text.trim() != 'PASSED') {
            throw new GradleException(report.exists() ? report.text : 'Client check did not produce a report')
        }
    }
}
