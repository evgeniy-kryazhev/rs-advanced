plugins {
    id 'base'
    id 'architectury-plugin' version '3.4.164'
    id 'dev.architectury.loom' version '1.10.455' apply false
    id 'com.gradleup.shadow' version '8.3.8' apply false
}

architectury {
    minecraft = minecraft_version
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom'
    group = 'dev.rsadvanced'
    version = rootProject.mod_version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.creeperhost.net' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.terraformersmc.com/' }
        maven { url = 'https://maven.shedaniel.me/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.named('processResources') {
        def metadata = [
            modVersion: rootProject.mod_version,
            minecraftVersion: rootProject.minecraft_version,
            refinedStorageVersion: rootProject.refined_storage_version,
            neoforgeVersion: rootProject.neoforge_version,
            fabricLoaderVersion: rootProject.fabric_loader_version,
            architecturyApiVersion: rootProject.architectury_api_version
        ]
        inputs.properties(metadata)
        filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
            expand(metadata)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
        compileOnly 'org.apiguardian:apiguardian-api:1.1.2'
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE'))
    }
}

tasks.named('build') {
    dependsOn ':common:build', ':neoforge:build', ':fabric:build'
}
