plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    version = rootProject.neoforge_version
}

dependencies {
    compileOnly "com.refinedmods.refinedstorage:refinedstorage-neoforge:${rootProject.refined_storage_version}"
    testImplementation "com.refinedmods.refinedstorage:refinedstorage-neoforge:${rootProject.refined_storage_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.mojang:datafixerupper:8.0.16'
}
