name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test both loaders
        run: bash gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: rsadvanced
          path: |
            neoforge/build/libs/rsadvanced-neoforge-*.jar
            fabric/build/libs/rsadvanced-fabric-*.jar
            !**/*-sources.jar
            !**/*-dev.jar
            !**/*-dev-shadow.jar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            common/build/reports/tests/test/
            fabric/build/reports/gameTest/
            neoforge/build/reports/gameTest/
