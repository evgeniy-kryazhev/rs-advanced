name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test both loaders
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bash gradlew build "-Pmod_version=${GITHUB_REF_NAME#v}"
          else
            bash gradlew build
          fi

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Jobs have separate runners. Rebuild the tested commit without transferring Actions artifacts.
      - name: Build release JARs
        shell: bash
        run: bash gradlew :fabric:remapJar :neoforge:remapJar "-Pmod_version=${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "fabric/build/libs/rsadvanced-fabric-${version}.jar"
            "neoforge/build/libs/rsadvanced-neoforge-${version}.jar"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing release JAR: $asset"
              exit 1
            fi
          done

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            release_options=()
            if [[ "$version" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --draft --title "RS Advanced ${version}" \
              --generate-notes "${release_options[@]}"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
