plugins {
    id 'net.neoforged.moddev'
}

base.archivesName = 'rsadvanced-neoforge'
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

neoForge {
    version = rootProject.neoforge_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        rsadvanced { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.rsadvanced
    }
}

dependencies {
    implementation "com.refinedmods.refinedstorage:refinedstorage-neoforge:${rootProject.refined_storage_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
