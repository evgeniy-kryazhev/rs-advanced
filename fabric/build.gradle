plugins {
    id 'com.gradleup.shadow'
}

base.archivesName = 'rsadvanced-fabric'

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.blamejared.com/' }
        }
        filter { includeGroup 'mezz.jei' }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    modImplementation "com.refinedmods.refinedstorage:refinedstorage-fabric:${rootProject.refined_storage_version}"
    modImplementation('me.shedaniel.cloth:cloth-config-fabric:15.0.140') {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modCompileOnly 'com.terraformersmc:modmenu:11.0.3'
    modLocalRuntime 'com.terraformersmc:modmenu:11.0.3'
    // Local development only: no compile API, bundled JAR or published dependency.
    modLocalRuntime("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}") {
        transitive = false
    }
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = ''
}

jar {
    archiveClassifier = 'dev'
}

sourcesJar {
    from project(':common').sourceSets.main.allSource
}

apply from: rootProject.file('gradle/game-tests.gradle')
