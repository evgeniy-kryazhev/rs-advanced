plugins {
    id 'com.gradleup.shadow'
}

base.archivesName = 'rsadvanced-fabric'

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    modImplementation "com.refinedmods.refinedstorage:refinedstorage-fabric:${rootProject.refined_storage_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = ''
}

jar {
    archiveClassifier = 'dev'
}

sourcesJar {
    from project(':common').sourceSets.main.allSource
}

apply from: rootProject.file('gradle/game-tests.gradle')

// Build-time tooling is a separate mod and never enters either release JAR.
sourceSets {
    datagen {
        java.srcDir rootProject.file('common/src/datagen/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def diskDataOutput = rootProject.file('common/src/generated/resources').absolutePath

loom {
    mods {
        rsadvanced_datagen {
            sourceSet sourceSets.datagen
        }
    }
    runs {
        datagen {
            inherit server
            source sourceSets.datagen
            runDir 'build/run/datagen'
            property 'fabric-api.datagen'
            property 'fabric-api.datagen.output-dir', diskDataOutput
            property 'fabric-api.datagen.modid', 'rsadvanced_datagen'
        }
    }
}

tasks.named('runDatagen') {
    dependsOn tasks.named('datagenClasses')
    doFirst {
        // Datagen has no platform transforms. Architectury's live transformer leaves
        // non-daemon workers running after Fabric's generator returns on Windows.
        mainClass.set('net.fabricmc.devlaunchinjector.Main')
    }
}
